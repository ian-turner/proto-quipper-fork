name:                dpq
version:             0.0.1.1
author:              "Frank (Peng) Fu, Kohei Kishida, Neil J. Ross, Peter Selinger"
maintainer:          "peng.frank.fu@gmail.com, selinger@mathstat.dal.ca"
copyright:           "2022"

extra-source-files:
- README.md
- ChangeLog.md


# Metadata used when publishing your package
synopsis: An implementaiton of Proto-Quipper 

category:            Programming language

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:
        Please see the README at <https://gitlab.com/frank-peng-fu/dpq-remake#readme>
        for more information. 

homepage:   https://gitlab.com/frank-peng-fu/dpq-remake           

dependencies:
- base >= 4.7 && < 5
- random
- containers
- multiset
- parsec
- indents
- transformers
- mtl
- pretty
- haskeline
- filepath
- easyrender
- directory
- process
- nominal
- network
- syb
- numbers
- exceptions

library:
  source-dirs: src

executables:
  dpqi:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    - -O3
    - -fno-full-laziness
    dependencies:
    - dpq

  dpq:
    main:                Main.hs
    source-dirs:         executable
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    - -O3
    dependencies:
    - dpq

tests:
  dpq-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - dpq
